<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>conversor</title>
</head>

<body>
    <h1>Conversor de Moedas</h1>

    <h4>Converta 140 moedas com a taxa de câmbio comercial. <br>
        A Wise é a conta global para pagar, enviar e converter dinheiro <br>
        na moeda local.</h4>

    <div id="divConversor">
        <button id="buttonConversor">Conversor de Moedas</button>
        <button id="buttonConsulte">Consulte as moedas</button>
        <button id="buttonAlertas">Alertas de câmbio</button>
        <button id="buttonCompare">Compare o câmbio</button>
    </div>

    <div id="divMoedas">
        <p id="taxaCambio">Taxa de câmbio comercial</p>
        <input type="number" id="inputQuantia">
        <input type="number" id="inputConverter">
        <p id="quantia">Quantia</p>
        <p id="converter">Converter para</p>

    </div>

    <img id="logoWise" src="https://d21buns5ku92am.cloudfront.net/69645/images/470456-Frame-c061f4-large-1677657684.png" alt="Logo wise">

</body>

</html>
