<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1> Calculadora de IMC</h1>

    <div id="conteinerPrincipal">
        <div id="conteinerInputs">
            <input type="number" id="inputPeso" placeholder="Digite o peso (KG)"> <br>
            <input type="number" id="inputAltura" placeholder="Digite a altura"> <br>

        </div>
    </div>

    <div id="conteinerBotao">
        <button id="botaoCalcular">Calcular</button> <br>
    </div>

    <div id="conteinerSegurandoResultado">
        <div id="conteinerResultado">
            <label id="labelValorIMC">Clique em calcular para obter o IMC</label>
            <label id="labelClassificacao"></label>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
